<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14532d"/>
      <stop offset="100%" style="stop-color:#166534"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="80" r="180" fill="#16a34a" opacity="0.15"/>
  <circle cx="150" cy="550" r="220" fill="#16a34a" opacity="0.1"/>
  <circle cx="1100" cy="500" r="120" fill="#22c55e" opacity="0.08"/>

  <!-- Card background -->
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="url(#card)" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Logo circle -->
  <circle cx="160" cy="180" r="72" fill="#16a34a"/>
  <!-- Rice plant icon (from favicon) -->
  <g transform="translate(160,180)">
    <path d="M0,30 Q0,10 -5,-5 Q-8,-15 -3,-25 Q0,-30 0,-35" stroke="#f0fdf4" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M0,20 Q-12,5 -18,-5" stroke="#f0fdf4" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M0,10 Q12,-5 18,-10" stroke="#f0fdf4" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="-20" cy="-8" rx="11" ry="4" fill="#86efac" transform="rotate(-20 -20 -8)"/>
    <ellipse cx="20" cy="-13" rx="11" ry="4" fill="#86efac" transform="rotate(25 20 -13)"/>
    <circle cx="-2" cy="-32" r="3" fill="#fde047"/>
    <circle cx="4" cy="-36" r="3" fill="#fde047"/>
    <circle cx="-1" cy="-40" r="2.5" fill="#fde047"/>
  </g>

  <!-- Title Bengali -->
  <text x="260" y="155" font-family="'Noto Sans Bengali', Arial, sans-serif" font-size="72" font-weight="700" fill="#f0fdf4">কৃষি AI</text>
  <!-- Version badge -->
  <rect x="260" y="170" width="68" height="28" rx="6" fill="#22c55e"/>
  <text x="294" y="190" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#14532d" text-anchor="middle">v2.0</text>

  <!-- Divider line -->
  <line x1="100" y1="270" x2="1100" y2="270" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Tagline -->
  <text x="600" y="340" font-family="'Noto Sans Bengali', Arial, sans-serif" font-size="36" font-weight="500" fill="#bbf7d0" text-anchor="middle">AI-চালিত কৃষি পরামর্শ সেবা</text>
  <text x="600" y="390" font-family="Arial, sans-serif" font-size="24" fill="#86efac" text-anchor="middle">AI-powered Agricultural Advisory for Bangladesh Farmers</text>

  <!-- Feature pills -->
  <g transform="translate(100, 440)">
    <!-- Chatbot -->
    <rect width="170" height="44" rx="22" fill="#16a34a" opacity="0.7"/>
    <text x="85" y="28" font-family="Arial, sans-serif" font-size="18" fill="#f0fdf4" text-anchor="middle">🤖 Chatbot</text>
    <!-- Disease -->
    <rect x="190" width="200" height="44" rx="22" fill="#16a34a" opacity="0.7"/>
    <text x="290" y="28" font-family="Arial, sans-serif" font-size="18" fill="#f0fdf4" text-anchor="middle">🐛 Disease AI</text>
    <!-- Weather -->
    <rect x="410" width="180" height="44" rx="22" fill="#16a34a" opacity="0.7"/>
    <text x="500" y="28" font-family="Arial, sans-serif" font-size="18" fill="#f0fdf4" text-anchor="middle">🌤️ Weather</text>
    <!-- Market -->
    <rect x="610" width="170" height="44" rx="22" fill="#16a34a" opacity="0.7"/>
    <text x="695" y="28" font-family="Arial, sans-serif" font-size="18" fill="#f0fdf4" text-anchor="middle">💹 Market</text>
    <!-- Soil -->
    <rect x="800" width="150" height="44" rx="22" fill="#16a34a" opacity="0.7"/>
    <text x="875" y="28" font-family="Arial, sans-serif" font-size="18" fill="#f0fdf4" text-anchor="middle">🪨 Soil</text>
  </g>

  <!-- URL -->
  <text x="600" y="570" font-family="Arial, sans-serif" font-size="20" fill="#4ade80" text-anchor="middle" opacity="0.8">krishiai-v2.vercel.app</text>
</svg>
